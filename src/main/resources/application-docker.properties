# MySQL 데이터소스 (Docker Compose 배포용, docker 프로필에서만 적용)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:babble}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:babble}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 전용 books 데모 테이블 초기화 스크립트는 MySQL에서 건너뜀
spring.sql.init.mode=never

spring.h2.console.enabled=false
